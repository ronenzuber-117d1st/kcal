<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#efe9e3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Kcal</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-title" content="Kcal">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#efe9e3; --card:#ffffff; --text:#222; --muted:#6b645e; --line:#ede5dc;
  --accent:#ff7a45; --accent-ink:#1d1d1d; --accent-text:#a63e0a; --accent-soft:#ffe3d6; --bar:#ffc9b0;
  --nav:#222; --navicon:#b3aca5; --danger:#d93a40; --input:#f5f1ed; --seg-off:#f3e7de;
  --shadow:0 1px 2px rgba(60,40,20,.05), 0 6px 18px rgba(60,40,20,.05);
  --ease:cubic-bezier(.22,1,.36,1);
}
[data-theme="dark"]{
  --bg:#141414; --card:#222; --text:#f1f1f1; --muted:#a39d97; --line:#333;
  --accent:#ff8a57; --accent-text:#ffa27a; --accent-soft:#3a2a22; --bar:#6b3f2b;
  --nav:#000; --navicon:#8a847e; --danger:#ff6b70; --input:#2c2c2c; --seg-off:#33291f;
  --shadow:none;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font-family:Heebo,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  font-variant-numeric:tabular-nums;transition:background .25s,color .25s}
body{min-height:100vh;padding-bottom:calc(104px + env(safe-area-inset-bottom))}
.app{max-width:480px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 16px 0}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:18px;gap:12px}
header .app-name{font-size:12px;color:var(--muted);font-weight:700;margin-bottom:2px}
header h1{font-size:24px;margin:0;font-weight:800;line-height:1.2;text-wrap:balance}
.tools{display:flex;gap:8px}
.icon-btn{border:none;background:var(--card);color:var(--text);width:44px;height:44px;border-radius:14px;
  font-size:14px;font-weight:800;cursor:pointer;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;
  font-family:inherit;transition:transform .15s var(--ease)}
.icon-btn:active{transform:scale(.94)}

.card{background:var(--card);border-radius:16px;padding:18px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h2{font-size:15px;margin:0 0 14px;font-weight:800}
.view{display:none}.view.active{display:block}

/* gauge */
.gauge{position:relative;width:100%;max-width:290px;margin:0 auto}
.gauge svg{display:block;width:100%;height:auto}
.seg{fill:none;stroke:var(--seg-off);stroke-width:14;stroke-linecap:round;transition:stroke .35s var(--ease)}
.seg.on{stroke:var(--accent)}
.seg.over{stroke:var(--danger)}
.gauge-center{position:absolute;left:0;right:0;bottom:2px;text-align:center}
.gauge-center .big{font-size:52px;font-weight:800;line-height:1;letter-spacing:-.02em}
.gauge-center .of{font-size:13px;color:var(--muted);margin-top:4px;font-weight:500}
.status{text-align:center;font-weight:800;font-size:15px;margin-top:10px;color:var(--accent-text)}
.status.over{color:var(--danger)}
.goal-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.goal-row label{margin:0;font-size:14px;font-weight:700;color:var(--text)}
.goal-row .g{display:flex;align-items:center;gap:8px}
.goal-row input{width:104px;text-align:center;font-weight:800;padding:10px 12px}
.goal-row span{font-size:13px;color:var(--muted)}

/* forms */
label{display:block;font-size:12px;color:var(--muted);margin:0 0 6px;font-weight:700}
input,select{width:100%;border:none;background:var(--input);color:var(--text);border-radius:12px;
  padding:14px;font-size:16px;font-family:inherit;outline:none;min-height:50px}
input::placeholder{color:var(--muted);opacity:.8}
input:focus-visible,select:focus-visible{box-shadow:0 0 0 2px var(--accent)}
.field{margin-bottom:12px}
.pair{display:flex;gap:10px;margin-bottom:14px}
.pair .sel{flex:1;min-width:0}.pair .gr{width:110px;flex:none}
.btn{width:100%;border:none;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:16px;
  min-height:52px;padding:0 16px;border-radius:14px;cursor:pointer;font-family:inherit;
  transition:transform .15s var(--ease),opacity .2s}
.btn:active{transform:scale(.98)}
.btn:focus-visible,.mini:focus-visible,.icon-btn:focus-visible,nav button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn:disabled{background:var(--input);color:var(--muted);cursor:default;transform:none}
.btn.ghost{background:var(--input);color:var(--text);font-weight:700;font-size:14px;min-height:46px}
.btns{display:flex;gap:10px}

/* lists */
.item{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:none;padding-bottom:0}
.item:first-child{padding-top:0}
.av{width:44px;height:44px;border-radius:12px;background:var(--accent-soft);color:var(--accent-text);
  display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;flex:none}
.item .info{flex:1;min-width:0}
.item .name{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .meta{font-size:13px;color:var(--muted);margin-top:2px}
.item .kcal{font-weight:800;font-size:18px;text-align:end;white-space:nowrap;line-height:1.1}
.item .kcal small{display:block;font-weight:500;color:var(--muted);font-size:11px;margin-top:2px}
.mini{border:none;background:transparent;color:var(--muted);width:44px;height:44px;border-radius:12px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none;margin-inline-end:-8px;transition:background .15s,color .15s}
.mini svg.i{width:19px;height:19px}
.mini:hover{background:var(--input)}
.mini.del:hover{color:var(--danger)}
.item.new{animation:slide .4s var(--ease)}
@keyframes slide{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.empty{text-align:center;color:var(--muted);font-size:14px;padding:6px 0 2px;line-height:1.6}
.empty .btn{margin-top:12px}

/* chart */
.chart{position:relative;height:190px;display:flex;align-items:flex-end;gap:8px;padding-top:22px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;position:relative;z-index:2}
.bar{width:100%;max-width:32px;border-radius:9px 9px 4px 4px;background:var(--bar);min-height:4px;
  transform-origin:bottom;animation:grow .6s var(--ease) backwards}
.bar.today{background:var(--accent)}
.bar.over{background:var(--danger)}
.bar.empty-day{background:var(--seg-off)}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.val{font-size:11px;font-weight:700;margin-bottom:4px;color:var(--muted);min-height:14px}
.goal-line{position:absolute;left:0;right:0;border-top:2px dashed var(--muted);opacity:.45;z-index:1}
.goal-tag{position:absolute;font-size:10px;font-weight:700;color:var(--muted);top:-15px;inset-inline-end:0}
.days{display:flex;gap:8px;margin-top:10px}
.days div{flex:1;text-align:center;font-size:12px;color:var(--muted);font-weight:700;line-height:1.3}
.days div span{display:inline-flex;flex-direction:column;align-items:center;min-width:32px;padding:5px 0;border-radius:10px}
.days div.t span{background:var(--accent);color:var(--accent-ink)}
.stats{display:grid;grid-template-columns:repeat(3,1fr)}
.stat{text-align:center;padding:2px 4px}
.stat+.stat{border-inline-start:1px solid var(--line)}
.stat b{display:block;font-size:22px;font-weight:800}
.stat span{font-size:12px;color:var(--muted);font-weight:500}

/* nav */
nav{position:fixed;bottom:calc(12px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
  width:calc(100% - 28px);max-width:452px;background:var(--nav);border-radius:24px;display:flex;
  padding:6px;gap:4px;z-index:10;box-shadow:0 10px 28px rgba(0,0,0,.22)}
nav button{flex:1;border:none;background:transparent;color:var(--navicon);min-height:56px;border-radius:18px;
  font-size:11px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-family:inherit;transition:background .25s var(--ease),color .25s}
nav button.active{background:var(--accent);color:var(--accent-ink)}
.hint{font-size:13px;color:var(--muted);margin-top:12px;line-height:1.55}
input[type=file]{display:none}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <div class="app-name" id="appName"></div>
      <h1 id="dateLabel"></h1>
    </div>
    <div class="tools">
      <button class="icon-btn" id="langBtn" aria-label="language"></button>
      <button class="icon-btn" id="themeBtn" aria-label="theme"></button>
    </div>
  </header>

  <!-- TODAY -->
  <section class="view active" id="v-today">
    <div class="card">
      <div class="gauge">
        <svg viewBox="0 0 260 140" id="gaugeSvg" aria-hidden="true"></svg>
        <div class="gauge-center">
          <div class="big" id="total">0</div>
          <div class="of" id="ofTxt"></div>
        </div>
      </div>
      <div class="status" id="leftTxt"></div>
      <div class="goal-row">
        <label id="l-goal" for="goalIn"></label>
        <div class="g"><input id="goalIn" type="number" inputmode="numeric" min="1" step="50"><span>kcal</span></div>
      </div>
    </div>

    <div class="card">
      <h2 id="t-addMeal"></h2>
      <div id="addArea"></div>
    </div>

    <div class="card">
      <h2 id="t-todayMeals"></h2>
      <div id="entries"></div>
    </div>
  </section>

  <!-- DISHES -->
  <section class="view" id="v-dishes">
    <div class="card">
      <h2 id="dishFormTitle"></h2>
      <div class="field"><label id="l-dname" for="dName"></label><input id="dName" type="text" autocomplete="off"></div>
      <div class="field"><label id="l-dkcal" for="dKcal"></label><input id="dKcal" type="number" inputmode="decimal" min="0" step="any"></div>
      <div class="btns">
        <button class="btn" id="saveDish"></button>
        <button class="btn ghost" id="cancelEdit" style="display:none"></button>
      </div>
    </div>
    <div class="card">
      <h2 id="t-myDishes"></h2>
      <div id="dishList"></div>
    </div>
    <div class="card">
      <h2 id="t-backup"></h2>
      <div class="btns">
        <button class="btn ghost" id="exportBtn"></button>
        <button class="btn ghost" id="importBtn"></button>
      </div>
      <input type="file" id="importFile" accept="application/json">
      <div class="hint" id="backupHint"></div>
    </div>
  </section>

  <!-- WEEK -->
  <section class="view" id="v-week">
    <div class="card">
      <h2 id="t-last7"></h2>
      <div class="chart" id="chart"></div>
      <div class="days" id="days"></div>
    </div>
    <div class="card">
      <div class="stats" id="stats"></div>
    </div>
  </section>
</div>

<nav>
  <button data-tab="today" class="active">
    <svg class="i" viewBox="0 0 24 24"><path d="M7 3v8M5 3v5a2 2 0 004 0V3M7 11v10M17 3c-2 1.5-3 4-3 7h3v11"/></svg>
    <span id="n-today"></span>
  </button>
  <button data-tab="dishes">
    <svg class="i" viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>
    <span id="n-dishes"></span>
  </button>
  <button data-tab="week">
    <svg class="i" viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>
    <span id="n-week"></span>
  </button>
</nav>

<script>
const IC = {
  trash:'<svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>',
  edit:'<svg class="i" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4zM13 7l4 4"/></svg>',
  sun:'<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  moon:'<svg class="i" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 019.5 4 8 8 0 1020 14.5z"/></svg>'
};

const T = {
  he:{
    title:"ספירת קלוריות", today:"היום", dishes:"מנות", week:"שבוע",
    addMeal:"הוספת אכילה", todayMeals:"מה אכלתי היום", chooseDish:"מנה", grams:"גרם",
    add:"הוסף", noDishes:"עוד אין מנות שמורות. הוסף את המנה הראשונה שלך כדי להתחיל.", addFirst:"הוספת מנה ראשונה",
    noEntries:"עוד לא הוספת כלום היום", kcalLeft:"נשארו", kcalOver:"חריגה של", goal:"יעד יומי", of:"מתוך",
    newDish:"מנה חדשה", editDish:"עריכת מנה", dname:"שם המנה",
    dkcal:"קלוריות ל-100 גרם", save:"שמור", saveEdit:"עדכן", cancel:"ביטול", myDishes:"המנות שלי",
    noSavedDishes:"אין מנות שמורות", per100:"ל-100 גרם", confirmDel:"למחוק את המנה? אכילות שכבר נרשמו לא ייפגעו.",
    last7:"השבוע (א'–ש')", avg:"ממוצע יומי", totalWeek:"סה\"כ שבוע", inGoal:"ימים ביעד",
    backup:"גיבוי", export:"ייצוא נתונים", import:"ייבוא נתונים",
    backupHint:"הנתונים נשמרים בדפדפן של הטלפון. מומלץ לייצא גיבוי מדי פעם.",
    imported:"הנתונים יובאו", badFile:"קובץ לא תקין", needFields:"נא למלא שם וקלוריות",
    kcal100:"קק\"ל ל-100 גרם", g:"גר'", goalLine:"יעד", lang:"EN"
  },
  en:{
    title:"Calorie Counter", today:"Today", dishes:"Dishes", week:"Week",
    addMeal:"Add a meal", todayMeals:"Eaten today", chooseDish:"Dish", grams:"Grams",
    add:"Add", noDishes:"No saved dishes yet. Add your first dish to get started.", addFirst:"Add your first dish",
    noEntries:"Nothing added today yet", kcalLeft:"left", kcalOver:"over by", goal:"Daily goal", of:"of",
    newDish:"New dish", editDish:"Edit dish", dname:"Dish name",
    dkcal:"Calories per 100 g", save:"Save", saveEdit:"Update", cancel:"Cancel", myDishes:"My dishes",
    noSavedDishes:"No saved dishes", per100:"per 100 g", confirmDel:"Delete this dish? Past entries are kept.",
    last7:"This week (Sun–Sat)", avg:"Daily avg", totalWeek:"Week total", inGoal:"Days on goal",
    backup:"Backup", export:"Export data", import:"Import data",
    backupHint:"Data is stored in your phone's browser. Export a backup once in a while.",
    imported:"Data imported", badFile:"Invalid file", needFields:"Please fill name and calories",
    kcal100:"kcal / 100 g", g:"g", goalLine:"goal", lang:"עב"
  }
};

const KEY = "kcal_app_v1";
let S = { dishes:[], log:{}, goal:2000, lang:"he", theme:"light" };
try { const r = JSON.parse(localStorage.getItem(KEY) || "null"); if (r) S = Object.assign(S, r); } catch(e){}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} };
const t = k => T[S.lang][k];
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const r0 = n => Math.round(n);
const initial = s => (String(s).trim()[0] || "•").toUpperCase();

function dateKey(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,"0"), dd=String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${dd}`;
}
const todayKey = () => dateKey(new Date());
const dayTotal = k => (S.log[k]||[]).reduce((a,e)=>a+e.kcal,0);

let editingId = null;
let tab = "today";
let lastDay = todayKey();
let justAddedId = null;

function applyStatic(){
  document.documentElement.lang = S.lang;
  document.documentElement.dir = S.lang==="he" ? "rtl" : "ltr";
  document.documentElement.setAttribute("data-theme", S.theme);
  $("themeBtn").innerHTML = S.theme==="dark" ? IC.sun : IC.moon;
  $("langBtn").textContent = t("lang");
  $("appName").textContent = t("title");
  $("dateLabel").textContent = new Date().toLocaleDateString(S.lang==="he"?"he-IL":"en-GB",{weekday:"long",day:"numeric",month:"long"});
  $("n-today").textContent=t("today"); $("n-dishes").textContent=t("dishes"); $("n-week").textContent=t("week");
  $("t-addMeal").textContent=t("addMeal"); $("t-todayMeals").textContent=t("todayMeals");
  $("l-goal").textContent=t("goal");
  $("l-dname").textContent=t("dname"); $("l-dkcal").textContent=t("dkcal");
  $("t-myDishes").textContent=t("myDishes"); $("t-last7").textContent=t("last7");
  $("t-backup").textContent=t("backup"); $("exportBtn").textContent=t("export"); $("importBtn").textContent=t("import");
  $("backupHint").textContent=t("backupHint"); $("cancelEdit").textContent=t("cancel");
  $("saveDish").textContent = editingId ? t("saveEdit") : t("save");
  $("dishFormTitle").textContent = editingId ? t("editDish") : t("newDish");
  $("cancelEdit").style.display = editingId ? "block" : "none";
}

/* ---------- GAUGE (segmented arc) ---------- */
const SEGS = 12;
(function buildGauge(){
  const cx=130, cy=126, r=106, span=Math.PI/SEGS, half=4.8/r;
  let html="";
  for (let i=0;i<SEGS;i++){
    const tc=(i+.5)*span, a=tc-half, b=tc+half;
    const p = th => [cx - r*Math.cos(th), cy - r*Math.sin(th)];
    const [x0,y0]=p(a), [x1,y1]=p(b);
    html += `<path class="seg" style="transition-delay:${i*35}ms" d="M${x0.toFixed(2)} ${y0.toFixed(2)} A${r} ${r} 0 0 1 ${x1.toFixed(2)} ${y1.toFixed(2)}"/>`;
  }
  $("gaugeSvg").innerHTML = html;
})();
function updateGauge(total, goal){
  const over = total>goal;
  let filled = Math.round(Math.min(total/goal,1)*SEGS);
  if (total>0 && filled===0) filled = 1;
  if (over) filled = SEGS;
  $("gaugeSvg").querySelectorAll(".seg").forEach((s,i)=>{
    s.classList.toggle("on", i<filled && !over);
    s.classList.toggle("over", i<filled && over);
  });
}

/* ---------- TODAY ---------- */
function renderToday(){
  const k = todayKey(), total = dayTotal(k), goal = S.goal || 2000;
  $("total").textContent = r0(total);
  $("ofTxt").textContent = `${t("of")} ${goal} kcal`;
  updateGauge(total, goal);
  const diff = r0(goal-total);
  $("leftTxt").textContent = diff>=0 ? `${t("kcalLeft")} ${diff} kcal` : `${t("kcalOver")} ${-diff} kcal`;
  $("leftTxt").classList.toggle("over", diff<0);
  if (document.activeElement !== $("goalIn")) $("goalIn").value = S.goal;

  const prevSel = $("selDish") ? $("selDish").value : "";
  const prevGr = $("gramsIn") ? $("gramsIn").value : "";
  if (!S.dishes.length){
    $("addArea").innerHTML = `<div class="empty">${t("noDishes")}<button class="btn" id="goDishes">${t("addFirst")}</button></div>`;
    $("goDishes").onclick = () => switchTab("dishes");
  } else {
    const sorted = [...S.dishes].sort((a,b)=>a.name.localeCompare(b.name, S.lang));
    $("addArea").innerHTML = `
      <div class="pair">
        <div class="sel"><label for="selDish">${t("chooseDish")}</label>
          <select id="selDish">${sorted.map(d=>`<option value="${d.id}">${esc(d.name)} · ${d.kcal100}</option>`).join("")}</select></div>
        <div class="gr"><label for="gramsIn">${t("grams")}</label>
          <input id="gramsIn" type="number" inputmode="decimal" min="0" step="any" placeholder="0"></div>
      </div>
      <button class="btn" id="addBtn" disabled>${t("add")}</button>`;
    if (prevSel && S.dishes.some(d=>d.id===prevSel)) $("selDish").value = prevSel;
    $("gramsIn").value = prevGr;
    const upd = () => {
      const d = S.dishes.find(x=>x.id===$("selDish").value);
      const g = parseFloat($("gramsIn").value);
      const kc = d && g>0 ? d.kcal100*g/100 : 0;
      $("addBtn").textContent = kc>0 ? `${t("add")} · ${r0(kc)} kcal` : t("add");
      $("addBtn").disabled = !(kc>0);
    };
    $("selDish").onchange = upd; $("gramsIn").oninput = upd; upd();
    $("addBtn").onclick = () => {
      const d = S.dishes.find(x=>x.id===$("selDish").value);
      const g = parseFloat($("gramsIn").value);
      if (!d || !(g>0)) return;
      const key = todayKey(), id = uid();
      (S.log[key] = S.log[key] || []).push({
        id, name:d.name, kcal100:d.kcal100, grams:g, kcal:d.kcal100*g/100,
        time:new Date().toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"})
      });
      justAddedId = id;
      save(); $("gramsIn").value=""; renderAll();
    };
  }

  const list = (S.log[k]||[]).slice().reverse();
  $("entries").innerHTML = list.length ? list.map(e=>`
    <div class="item ${e.id===justAddedId?"new":""}">
      <div class="av">${esc(initial(e.name))}</div>
      <div class="info"><div class="name">${esc(e.name)}</div>
        <div class="meta">${e.grams} ${t("g")}${e.time?" · "+e.time:""}</div></div>
      <div class="kcal">${r0(e.kcal)}<small>kcal</small></div>
      <button class="mini del" data-del="${e.id}" aria-label="delete">${IC.trash}</button>
    </div>`).join("") : `<div class="empty">${t("noEntries")}</div>`;
  justAddedId = null;
  $("entries").querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{
    const key = todayKey();
    S.log[key] = (S.log[key]||[]).filter(e=>e.id!==b.dataset.del);
    save(); renderAll();
  });
}

/* ---------- DISHES ---------- */
function renderDishes(){
  const list = [...S.dishes].sort((a,b)=>a.name.localeCompare(b.name, S.lang));
  $("dishList").innerHTML = list.length ? list.map(d=>`
    <div class="item">
      <div class="av">${esc(initial(d.name))}</div>
      <div class="info"><div class="name">${esc(d.name)}</div>
        <div class="meta">${d.kcal100} kcal ${t("per100")}</div></div>
      <button class="mini" data-edit="${d.id}" aria-label="edit">${IC.edit}</button>
      <button class="mini del" data-rm="${d.id}" aria-label="delete">${IC.trash}</button>
    </div>`).join("") : `<div class="empty">${t("noSavedDishes")}</div>`;
  $("dishList").querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>{
    const d = S.dishes.find(x=>x.id===b.dataset.edit); if(!d) return;
    editingId = d.id; $("dName").value = d.name; $("dKcal").value = d.kcal100;
    applyStatic(); window.scrollTo({top:0,behavior:"smooth"});
  });
  $("dishList").querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{
    if (!confirm(t("confirmDel"))) return;
    S.dishes = S.dishes.filter(x=>x.id!==b.dataset.rm);
    if (editingId===b.dataset.rm) resetDishForm();
    save(); renderAll();
  });
}
function resetDishForm(){ editingId=null; $("dName").value=""; $("dKcal").value=""; applyStatic(); }
$("saveDish").onclick = () => {
  const name = $("dName").value.trim(), kc = parseFloat($("dKcal").value);
  if (!name || isNaN(kc) || kc<0) { alert(t("needFields")); return; }
  if (editingId){
    const d = S.dishes.find(x=>x.id===editingId);
    if (d){ d.name=name; d.kcal100=kc; }
  } else {
    S.dishes.push({id:uid(), name, kcal100:kc});
  }
  save(); resetDishForm(); renderAll();
};
$("cancelEdit").onclick = resetDishForm;

/* backup */
$("exportBtn").onclick = () => {
  const blob = new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = `kcal-backup-${todayKey()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
};
$("importBtn").onclick = () => $("importFile").click();
$("importFile").onchange = e => {
  const f = e.target.files[0]; if(!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const o = JSON.parse(rd.result);
      if (!Array.isArray(o.dishes) || typeof o.log !== "object") throw 0;
      S = Object.assign(S, o); save(); renderAll(); alert(t("imported"));
    } catch(err){ alert(t("badFile")); }
  };
  rd.readAsText(f); e.target.value="";
};

/* ---------- WEEK (Sun–Sat, resets each week) ---------- */
function renderWeek(){
  const goal = S.goal || 2000, days = [];
  const tk = todayKey();
  const now = new Date();
  const sunday = new Date(now.getFullYear(), now.getMonth(), now.getDate() - now.getDay());
  for (let i=0;i<7;i++){
    const d = new Date(sunday.getFullYear(), sunday.getMonth(), sunday.getDate()+i);
    const k = dateKey(d);
    days.push({d, k, v: k>tk ? 0 : dayTotal(k)});
  }
  const LBL = S.lang==="he" ? ["א'","ב'","ג'","ד'","ה'","ו'","ש'"] : ["S","M","T","W","T","F","S"];
  const maxV = Math.max(goal, ...days.map(x=>x.v))*1.12;
  const H = 140;
  $("chart").innerHTML = `
    <div class="goal-line" style="bottom:${(goal/maxV)*H}px"><span class="goal-tag">${t("goalLine")} ${goal}</span></div>` +
    days.map((x,i)=>`
      <div class="col">
        <div class="val">${x.v?r0(x.v):""}</div>
        <div class="bar ${x.k===tk?"today":""} ${x.v>goal?"over":""} ${x.v?"":"empty-day"}"
          style="height:${x.v?(x.v/maxV)*H:4}px;animation-delay:${i*45}ms"></div>
      </div>`).join("");
  $("days").innerHTML = days.map((x,i)=>`<div class="${x.k===tk?"t":""}"><span>${LBL[i]}<span style="display:block;font-weight:500;font-size:11px;padding:0;min-width:0;background:none">${x.d.getDate()}</span></span></div>`).join("");
  const withData = days.filter(x=>x.v>0);
  const sum = days.reduce((a,x)=>a+x.v,0);
  const avg = withData.length ? sum/withData.length : 0;
  const onGoal = withData.filter(x=>x.v<=goal).length;
  $("stats").innerHTML = `
    <div class="stat"><b>${r0(avg)}</b><span>${t("avg")}</span></div>
    <div class="stat"><b>${r0(sum)}</b><span>${t("totalWeek")}</span></div>
    <div class="stat"><b>${onGoal}/${withData.length}</b><span>${t("inGoal")}</span></div>`;
}

/* ---------- misc ---------- */
function renderAll(){ applyStatic(); renderToday(); renderDishes(); renderWeek(); }

function switchTab(name){
  tab = name;
  document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("active",x.dataset.tab===name));
  document.querySelectorAll(".view").forEach(v=>v.classList.toggle("active",v.id==="v-"+name));
  if (name==="week") renderWeek();
  window.scrollTo({top:0});
}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));

$("goalIn").oninput = () => {
  const v = parseFloat($("goalIn").value);
  if (v>0){ S.goal=v; save(); renderToday(); renderWeek(); }
};
$("goalIn").onblur = () => { $("goalIn").value = S.goal; };
$("langBtn").onclick = () => { S.lang = S.lang==="he"?"en":"he"; save(); renderAll(); };
$("themeBtn").onclick = () => { S.theme = S.theme==="dark"?"light":"dark"; save(); renderAll(); };

// new day / new week: log is keyed by date, so a new day starts empty and the week chart rolls over automatically
function checkDay(){ const k=todayKey(); if (k!==lastDay){ lastDay=k; renderAll(); } }
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) checkDay(); });
setInterval(checkDay, 60000);

renderAll();
</script>
